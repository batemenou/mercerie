    <style>
        .color-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .color-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            display: none;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }
    </style>

        function renderColors(filter = 'all') {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? colorData : colorData.filter(c => c.cat === filter);
            document.getElementById('color-count').innerText = filtered.length;

            filtered.forEach(color => {
                const isLight = isColorLight(color.hex);
                const card = document.createElement('div');
                card.className = 'color-card bg-white rounded-lg overflow-hidden border border-gray-200 cursor-pointer flex flex-col h-full';
                card.onclick = () => copyHex(color.hex);
                
                card.innerHTML = `
                    <div class="h-16 w-full flex items-end justify-end p-1.5" style="background-color: ${color.hex}">
                        <span class="text-[8px] font-mono font-bold px-1 rounded-sm ${isLight ? 'bg-black/10 text-black/60' : 'bg-white/20 text-white/80'}">
                            ${color.hex}
                        </span>
                    </div>
                    <div class="p-2 flex-grow flex flex-col justify-center">
                        <h4 class="text-[10px] font-black text-gray-800 leading-tight uppercase truncate">${color.name}</h4>
                        <p class="text-[8px] text-gray-400 font-bold uppercase mt-0.5">${color.cat}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterColors(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-white', 'text-gray-600', 'border');
            });
            event.target.classList.remove('bg-white', 'text-gray-600', 'border');
            event.target.classList.add('bg-indigo-600', 'text-white');
            renderColors(category);
        }

        function isColorLight(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            // Formule de luminosité perçue
            const brightness = (r * 299 + g * 587 + b * 114) / 1000;
            return brightness > 175;
        }

        function copyHex(hex) {
            const el = document.createElement('textarea');
            el.value = hex;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 1500);
        }

        window.onload = () => renderColors();
