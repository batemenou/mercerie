<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuancier Mercerie - 100 Couleurs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .color-card {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .color-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            display: none;
            z-index: 50;
        }
        .category-badge {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">

    <header class="bg-white border-b border-slate-200 py-6 sticky top-0 z-40 shadow-sm">
        <div class="container mx-auto px-4">
            <h1 class="text-2xl font-bold text-slate-800">Nuancier Expert : 100 Nuances</h1>
            <p class="text-slate-500 text-sm">Cliquez sur une couleur pour copier son code HEX</p>
            
            <div class="flex flex-wrap gap-2 mt-4" id="filter-buttons">
                <button onclick="filterColors('all')" class="filter-btn active bg-slate-800 text-white px-3 py-1.5 rounded-md text-xs font-semibold">Toutes</button>
                <button onclick="filterColors('neutres')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Neutres & Gris</button>
                <button onclick="filterColors('bleus')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Bleus</button>
                <button onclick="filterColors('verts')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Verts</button>
                <button onclick="filterColors('rouges-roses')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Rouges & Roses</button>
                <button onclick="filterColors('jaunes-terres')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Jaunes & Terres</button>
                <button onclick="filterColors('vifs')" class="filter-btn bg-white border border-slate-200 px-3 py-1.5 rounded-md text-xs font-semibold hover:bg-slate-50">Vifs & Néons</button>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 mt-8">
        <div id="color-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <!-- Dynamically populated -->
        </div>
    </div>

    <div id="toast" class="copy-toast">Copié dans le presse-papier !</div>

            // VIFS & SPECIAUX (93-100)
            { name: "Jaune Fluo", hex: "#DFFF00", cat: "vifs" },
            { name: "Rose Néon", hex: "#FF6EC7", cat: "vifs" },
            { name: "Vert Fluo", hex: "#39FF14", cat: "vifs" },
            { name: "Cuivre", hex: "#B87333", cat: "vifs" },
            { name: "Laiton", hex: "#B5A642", cat: "vifs" },
            { name: "Or Pur", hex: "#FFD700", cat: "vifs" },
            { name: "Argent Vieilli", hex: "#8A8D8F", cat: "vifs" },
            { name: "Bronze", hex: "#CD7F32", cat: "vifs" }
        ];

        function renderColors(filter = 'all') {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? colorData : colorData.filter(c => c.cat === filter);

            filtered.forEach(color => {
                const isLight = isColorLight(color.hex);
                const card = document.createElement('div');
                card.className = 'color-card bg-white rounded-lg overflow-hidden shadow-sm border border-slate-200 cursor-pointer flex flex-col';
                card.onclick = () => copyHex(color.hex);
                
                card.innerHTML = `
                    <div class="h-16 w-full flex items-end justify-end p-1" style="background-color: ${color.hex}">
                        <span class="text-[9px] font-mono px-1 rounded ${isLight ? 'bg-black/10 text-black/60' : 'bg-white/20 text-white/80'}">
                            ${color.hex}
                        </span>
                    </div>
                    <div class="p-2 flex-grow">
                        <p class="text-[10px] font-bold text-slate-800 leading-tight">${color.name}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterColors(category) {
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-white');
                btn.classList.add('bg-white', 'text-slate-800');
            });
            event.target.classList.remove('bg-white', 'text-slate-800');
            event.target.classList.add('bg-slate-800', 'text-white');
            renderColors(category);
        }

        function isColorLight(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 > 165;
        }

        function copyHex(hex) {
            const el = document.createElement('textarea');
            el.value = hex;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 1500);
        }

        window.onload = () => renderColors();
    </script>
</body>
</html>
